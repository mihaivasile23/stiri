<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Știri</title>
  <meta name="description" content="Titlurile zilei din presa internațională și românească, într-un singur loc.">
  <meta name="theme-color" content="#F2F4F3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Știri">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-row">
      <h1 class="brand">Știri</h1>
      <p class="updated" id="updated" aria-live="polite"></p>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Secțiuni"></nav>
  </header>

  <main id="main" tabindex="-1">
    <p class="notice" id="notice">Se încarcă titlurile…</p>
  </main>

  <footer class="foot">
    <details id="status">
      <summary id="status-summary">Starea surselor</summary>
      <div id="status-body"></div>
    </details>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
